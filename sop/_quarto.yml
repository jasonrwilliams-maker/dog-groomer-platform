# The shop's SOP: three manuals, one for each kind of reader, built from
# modules. Build it from this folder with `quarto render` (or
# `quarto preview` to watch it while you write). The finished site lands in
# _site/, which is not kept in git.
#
# Where things go:
#   groomer/, manager/, systems/   one module per page, per manual
#   _shared/                       modules more than one manual uses; a page
#                                  pulls one in with {{< include >}}
#   screenshots/                   every picture, one folder per manual;
#                                  replace a file and rebuild, every page
#                                  that shows it updates. To retake them
#                                  all from the app in one go, see
#                                  screenshots/README.md
#   _template.qmd                  copy this to start a new module
#   WRITING.md                     how every module is worded and laid out
#
# Files and folders starting with _ are never pages on their own.
project:
  type: website
  output-dir: _site
  # Pages are the .qmd files; notes like screenshots/README.md stay notes.
  render:
    - "**/*.qmd"
  # Reads the shop's rules out of sql/ before every build, so the systems
  # manual's list of rules is never out of date.
  pre-render: python _scripts/shop_rules.py

website:
  title: "Grooming shop SOP"
  page-navigation: true
  search: true
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Which manual is yours?
      - section: "Groomer manual"
        href: groomer/index.qmd
        contents:
          - groomer/signing-in.qmd
          - groomer/checking-in-a-dog.qmd
          - groomer/new-client.qmd
          - groomer/another-dog.qmd
          - groomer/edit-profile.qmd
          - groomer/paperwork.qmd
          - groomer/allergies.qmd
          - groomer/handling.qmd
          - groomer/dog-photo.qmd
          - groomer/book-a-groom.qmd
          - groomer/change-booking.qmd
          - groomer/calendar.qmd
          - groomer/record-the-haircut.qmd
      - section: "Manager manual"
        href: manager/index.qmd
        contents:
          - manager/signing-in.qmd
          - manager/opening-admin.qmd
          - manager/admin-overview.qmd
          - manager/verify-shots.qmd
          - manager/paperwork-to-check.qmd
          - manager/second-look.qmd
          - manager/allergy-reviews.qmd
          - manager/passkeys-and-pin.qmd
      - section: "Technical systems manual"
        href: systems/index.qmd
        contents:
          - systems/shop-rules.qmd
          - systems/ai-key.qmd
          - systems/start-the-app.qmd
          - systems/database-tests.qmd
          - systems/github-checks.qmd
          - systems/publishing.qmd
          - systems/reset-databases.qmd
          - systems/backup-and-restore.qmd

format:
  html:
    theme: [cosmo, brand.scss]
    css: styles.css
    # "On this page", on the right of every page: each section and its
    # subsections, always expanded.
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: true
    # Sections are numbered (4 Procedure, 6.1 …), so "GRM-02 §6.1" points to
    # one exact place. Every heading also has a link icon on hover, to copy
    # or bookmark a link straight to it.
    number-sections: true
    number-depth: 3
    anchor-sections: true
    # Pictures open larger when tapped.
    lightbox: true
    # "Procedure 4 of 13", and Mark as read, at the bottom of each page.
    include-after-body: _progress.html
