services:
  db:
    build:
      context: ./docker
      dockerfile: test.dockerfile
    container_name: groomer-db
    working_dir: /repo              # short relative paths from here on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grooming_test
    ports:
      - "5432:5432"
    volumes:
      - ./:/repo                    # your repo, visible inside the container
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grooming_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The extraction harness. Not started by `docker compose up`; run it on demand
  # with `docker compose run --rm harness <command>` (see extraction/harness/README.md).
  harness:
    build:
      context: ./extraction/harness
    profiles: ["harness"]
    working_dir: /repo/extraction/harness
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/grooming_test
    volumes:
      - ./:/repo
    depends_on:
      db:
        condition: service_healthy

  # The labelling and review tool (extraction/review/), and the web front for
  # every command above: its Run & test screen runs the harness, the schema
  # load and the pgTAP suite. Starts with `docker compose up -d`; open
  # http://localhost:8501. It shows the real pages in private/, so it listens
  # on this machine only.
  review:
    build:
      context: ./extraction
      dockerfile: review/Dockerfile
    working_dir: /repo/extraction/review
    env_file: .env                  # ANTHROPIC_API_KEY and EXTRACTION_MODEL, for model runs
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/grooming_test
      PGHOST: db                    # psql and pg_prove read these
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: grooming_test
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./:/repo
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: