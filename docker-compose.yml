services:
  db:
    build:
      context: ./docker
      dockerfile: test.dockerfile
    container_name: groomer-db
    working_dir: /repo              # short relative paths from here on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grooming_test
    ports:
      - "5432:5432"
    volumes:
      - ./:/repo                    # your repo, visible inside the container
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: